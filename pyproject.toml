[build-system]
requires = ["setuptools==68.2.2", "wheel"]
build-backend = "setuptools.build_meta"

[tool.poetry]
name = "duolingo-api"
version = "0.5.4"
description = "Unofficial API for duolingo.com"
authors = ["Kartik Talwar <hi@kartikt.com>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "duolingo.py" }]

[tool.poetry.dependencies]
python = ">=3.8"
requests = ">=2.0"
